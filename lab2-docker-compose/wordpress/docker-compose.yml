version: '3.8'

services:
  wordpress:
    image: wordpress:4.4
    depends_on:
      - wordpress_db
    ports:
      - "8182:80"

  wordpress_db:
    image: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: test

  phpmyadmin:
    image: corbinu/docker-phpmyadmin
    depends_on:
      - wordpress_db
    ports:
      - "8181:80"
    environment:
      MYSQL_USERNAME: root
      MYSQL_ROOT_PASSWORD: test
